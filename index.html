<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Admin</title>
    <style>
      #entry-loading {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      #entry-loading.hide {
        opacity: 0;
        pointer-events: none;
      }

      #entry-loading::before {
        content: '';
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #1989fa;
        border-left-color: #1989fa;
        animation: entry-spin 0.6s linear infinite;
      }

      @keyframes entry-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="entry-loading"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
